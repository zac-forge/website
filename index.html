<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Per-page head. scripts/prerender.mjs replaces the title and the marker
      below with each route's description, canonical, Open Graph tags, and
      JSON-LD from src/lib/meta.ts and src/lib/schema.ts. The dev server shows
      this template as-is, which is why it carries a plain title.
    -->
    <title>ZAC Forge</title>
    <!--app-head-->
    <meta name="theme-color" content="#0C0C0F" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <noscript>
      <style>
        /* The prerendered markup carries Motion's entrance state as inline
           opacity:0. With scripting off nothing ever animates it back, so the
           copy would be in the HTML but invisible. This only applies when
           scripts do not run, so it cannot affect the normal path. */
        #root [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

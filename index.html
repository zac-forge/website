    <!--
      Organization plus a single Person for Andrew. The other two team
      members are unnamed on the page pending their consent, so they get no
      Person entry: the entity graph must not carry a name the page will
      not show.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZAC Forge",
        "alternateName": "ZAC",
        "legalName": "ZAC Consulting LLC",
        "url": "https://zacforge.com/",
        "logo": "https://zacforge.com/brand/zacforge-lockup.webp",
        "image": "https://zacforge.com/og-image.jpg",
        "email": "hello@zacforge.com",
        "founder": {
          "@type": "Person",
          "name": "Andrew Johnston",
          "jobTitle": "Founder",
          "worksFor": { "@type": "Organization", "name": "ZAC Forge" }
        },
        "description": "A senior technology studio. 15 years, over 100 engagements, and systems still running after 16. We build what your business runs on.",
        "knowsAbout": [
          "Technology strategy",
          "Custom software development",
          "Web applications",
          "Workflow automation",
          "Product development",
          "Systems integration"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Advise",
                "description": "Technology strategy, what to build and in what order, second opinions on decisions and vendors, workflow analysis, architecture and planning."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Build",
                "description": "Custom software, web applications, internal tools, workflow automation, integrations, high-performance websites, prototypes."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Partner",
                "description": "Fractional technology leadership, continuous product development, standing senior review, specialist teams assembled to the work, fixing what someone else built."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <!--
      Organization-level structured data only. No Person schema and no
      individual contact details, so the entity Google builds is the studio
      rather than any one person.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZAC Forge",
        "alternateName": "ZAC",
        "legalName": "ZAC Consulting LLC",
        "url": "https://zacforge.com/",
        "logo": "https://zacforge.com/brand/zacforge-wordmark.svg",
        "image": "https://zacforge.com/og-image.jpg",
        "email": "hello@zacforge.com",
        "description": "Senior technology judgment plus AI-native execution. ZAC advises, designs, and builds working technology faster than used to be possible, without agency overhead.",
        "knowsAbout": [
          "Technology strategy",
          "AI integration",
          "Custom software development",
          "Web applications",
          "Workflow automation",
          "Product development"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Advise",
                "description": "Technology strategy, AI opportunity assessment, product and platform direction, workflow analysis, and architecture planning."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Build",
                "description": "Custom software, web applications, high-performance websites, internal tools, workflow automation, AI integrations and agents, prototypes and MVPs."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Partner",
                "description": "Fractional technology leadership, ongoing product development, technical problem solving, specialist team assembly, and existing platform improvement."
              }
            }
          ]
        }
      }
    </script>

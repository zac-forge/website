<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/brand/favicon-180.png" />

    <meta name="theme-color" content="#0C0C0F" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZAC: The systems we built in 2010 are still running." />
    <meta
      property="og:description"
      content="A senior technology studio. Systems we built in 2010 are still in production, run by the teams we handed them to. 15 years and over 100 engagements."
    />
    <meta property="og:image" content="https://zacforge.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Organization plus a single Person for Andrew. The other two team
      members are unnamed on the page pending their consent, so they get no
      Person entry: the entity graph must not carry a name the page will
      not show.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZAC Forge",
        "alternateName": "ZAC",
        "legalName": "ZAC Consulting LLC",
        "url": "https://zacforge.com/",
        "logo": "https://zacforge.com/brand/zacforge-lockup.webp",
        "image": "https://zacforge.com/og-image.jpg",
        "email": "hello@zacforge.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ventura",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "founder": {
          "@type": "Person",
          "name": "Andrew Johnston",
          "jobTitle": "Founder",
          "worksFor": { "@type": "Organization", "name": "ZAC Forge" }
        },
        "description": "A senior technology studio. Systems we built in 2010 are still in production, run by the teams we handed them to. 15 years and over 100 engagements.",
        "knowsAbout": [
          "Technology strategy",
          "Custom software development",
          "Web applications",
          "Workflow automation",
          "Product development",
          "Systems integration"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Advise",
                "description": "Technology strategy, what to build and in what order, second opinions on decisions and vendors, workflow analysis, architecture and planning."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Build",
                "description": "Custom software, web applications, internal tools, workflow automation, integrations, high-performance websites, prototypes."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Partner",
                "description": "Fractional technology leadership, continuous product development, standing senior review, specialist teams assembled to the work, fixing what someone else built."
              }
            }
          ]
        }
      }
    </script>
    <noscript>
      <style>
        /* The prerendered markup carries Motion's entrance state as inline
           opacity:0. With scripting off nothing ever animates it back, so the
           copy would be in the HTML but invisible. This only applies when
           scripts do not run, so it cannot affect the normal path. */
        #root [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

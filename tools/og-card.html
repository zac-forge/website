<!doctype html>
<!--
  Source for public/og-image.jpg. A local generator, not part of the built
  site, so it lives outside public/ and is never deployed.

  It mirrors the v5 hero in src/components/Hero.tsx: the navy band with its
  sweep, the eyebrow, the two-weight headline, the proof line, and the
  board's Z (public/art/z-hero.svg). Colours are copied from
  design/tokens.json. Change this file whenever the hero copy changes.

  To regenerate, render the 1200 x 630 .og-card at 2x and downscale to
  exactly 1200 x 630 (see README.md, "Regenerating the OG image"). The OG
  title in the page head is separate: it lives in src/lib/meta.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ZAC Forge OG card</title>
    <style>
      @font-face {
        font-family: "Figtree";
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource/figtree/files/figtree-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Figtree";
        font-weight: 900;
        font-display: block;
        src: url("../node_modules/@fontsource/figtree/files/figtree-latin-900-normal.woff2") format("woff2");
      }

      /* Copied from design/tokens.json. */
      :root {
        --color-bg: #ebebeb;
        --color-band-navy: #3b5480;
        --color-on-band: #ffffff;
        --font-sans: Avenir, "Avenir Next", Figtree, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }

      .og-card {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 56px;
        align-items: center;
        padding: 0 80px 24px;
        background: var(--color-band-navy);
        border-bottom-left-radius: 200px;
        color: var(--color-on-band);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .eyebrow {
        margin: 0 0 24px;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgb(255 255 255 / 0.82);
      }
      .headline {
        margin: 0 0 32px;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
      .headline .light {
        font-weight: 400;
      }
      .proof {
        margin: 0;
        max-width: 560px;
        text-wrap: balance;
        font-size: 21px;
        line-height: 1.4;
        color: rgb(255 255 255 / 0.82);
      }
      .art img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="og-card">
      <div>
        <p class="eyebrow">/ ZAC / Senior team, plain answers</p>
        <h1 class="headline"><span class="light">Built it with AI?</span> Find out if it actually works.</h1>
        <p class="proof">Decades of Fortune 50 experience. Systems we built in 2010 still run today.</p>
      </div>
      <div class="art">
        <img src="../public/art/z-hero.svg" alt="" />
      </div>
    </div>
  </body>
</html>
